<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiestas</title>
</head>
<body>
    <div id="fiesta"></div>
    <script>
        const url_base = "http://127.0.0.1:8000/v1"

        function leerFiestas() {
            fetch(`${url_base}/fiestas`)
            .then(response => response.json())
            .then(data => {
                const fiestasDiv = document.getElementById("fiesta")
                fiestasDiv.textContent = JSON.stringify(data)
            })
            .catch(error => console.error("Error: ", error))
        }

        function darFiestaDeAlta() {
            
        }

        leerFiestas()
    </script>
</body>
</html>
