<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabla y formulario</title>
</head>
<body>
    <table border = "1">
        <caption>Tabla</caption>
        <thead>
            <tr>
                <th>A</th>
                <th>B</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>aa</td>
                <td>ba</td>
            </tr>
            <tr>
                <td>ab</td>
                <td>bb</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="2">combinaciones</td>
            </tr>
        </tfoot>
    </table>
    <br/>
    <hr/>
    <br/>
    <form action = "./submit" method = "post">
        <label for="name">Nombre:</label>
        <input type="text" name="name"/>
        <br/><br/>
        <label for="pass">Contraseña:</label>
        <input type="password" name="pass"/>
        <br/><br/>
        <label for="drop">Opciones: </label>
        <select name="drop">
            <option value="0">opción 1</option>
            <option value="1">opción 2</option>
        </select>
        <br/><br/>
        <label for="text">Cuadro de texto: </label>
        <textarea name="text">mucho texto</textarea>
        <br/><br/>
        <button type="submit">Enviar</button>
    </form>
</body>
</html>
